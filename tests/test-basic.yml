name: Test basic credential setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          credentials: "https://testuser:testtoken@github.com/"

      - name: Assert credentials file exists and is non-empty
        run: |
          CRED_FILE="${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials"
          echo "Checking credentials file: $CRED_FILE"
          if [ ! -f "$CRED_FILE" ]; then
            echo "FAIL: credentials file does not exist at $CRED_FILE"
            exit 1
          fi
          echo "PASS: credentials file exists"
          LINE_COUNT=$(grep -c . "$CRED_FILE" || true)
          echo "Line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -lt 1 ]; then
            echo "FAIL: credentials file is empty"
            exit 1
          fi
          echo "PASS: credentials file is non-empty"

      - name: Assert credential.helper is set to store
        run: |
          HELPER=$(git config --global credential.helper)
          echo "credential.helper: $HELPER"
          if [ "$HELPER" != "store" ]; then
            echo "FAIL: expected credential.helper=store, got '$HELPER'"
            exit 1
          fi
          echo "PASS: credential.helper=store"

      - name: Assert SSH-to-HTTPS URL rewrite for ssh protocol
        run: |
          REWRITE=$(git config --global --get-all "url.https://github.com/.insteadOf" | grep "ssh://git@github.com/" || true)
          echo "insteadOf (ssh): $REWRITE"
          if [ -z "$REWRITE" ]; then
            echo "FAIL: expected url rewrite for ssh://git@github.com/ not found"
            exit 1
          fi
          echo "PASS: SSH URL rewrite configured"

      - name: Assert SSH-to-HTTPS URL rewrite for git at protocol
        run: |
          REWRITE=$(git config --global --get-all "url.https://github.com/.insteadOf" | grep "git@github.com:" || true)
          echo "insteadOf (git@): $REWRITE"
          if [ -z "$REWRITE" ]; then
            echo "FAIL: expected url rewrite for git@github.com: not found"
            exit 1
          fi
          echo "PASS: git@ URL rewrite configured"
