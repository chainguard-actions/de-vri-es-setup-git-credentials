name: Test multiple credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          credentials: |
            https://user1:token1@github.com/
            https://user2:token2@example.com/

      - name: Assert credentials file exists and has multiple lines
        run: |
          CRED_FILE="${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials"
          echo "Checking credentials file: $CRED_FILE"
          if [ ! -f "$CRED_FILE" ]; then
            echo "FAIL: credentials file does not exist at $CRED_FILE"
            exit 1
          fi
          LINE_COUNT=$(grep -c . "$CRED_FILE" || true)
          echo "Line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 credential lines, got $LINE_COUNT"
            exit 1
          fi
          echo "PASS: credentials file has $LINE_COUNT lines"

      - name: Assert credential.helper is set to store
        run: |
          HELPER=$(git config --global credential.helper)
          echo "credential.helper: $HELPER"
          if [ "$HELPER" != "store" ]; then
            echo "FAIL: expected credential.helper=store, got '$HELPER'"
            exit 1
          fi
          echo "PASS: credential.helper=store"

      - name: Assert credentials file permissions are 0600
        run: |
          CRED_FILE="${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials"
          PERMS=$(stat -c "%a" "$CRED_FILE")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: credentials file has correct permissions (600)"
